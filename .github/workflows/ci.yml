name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: 创建器检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VP_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: '1.4.0'
          node-version-file: .node-version
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run build
      - uses: actions/upload-artifact@v7
        with:
          name: create-vp-starter-${{ matrix.os }}
          path: .artifacts/create-vp-starter.tgz
          include-hidden-files: true
          if-no-files-found: error
  templates:
    name: 模板验证 (${{ matrix.os }}, ${{ matrix.template }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        template: [vue3-ts, monorepo]
    env:
      VP_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: '1.4.0'
          node-version-file: .node-version
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp run test:package ${{ matrix.template }}
