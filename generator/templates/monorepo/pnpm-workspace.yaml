packages:
  - apps/*
  - packages/*
catalog:
  '@changesets/cli': '^3.0.3'
  '@commitlint/cli': '^20.5.3'
  '@commitlint/config-conventional': '^21.2.4'
  '@types/node': '^24.19.2'
  '@vitejs/plugin-vue': '^6.0.10'
  '@vue/tsconfig': '^0.9.1'
  '@vue/test-utils': '^2.5.1'
  'commitizen': '^4.3.2'
  'cz-git': '^1.14.0'
  'element-plus': '^2.14.7'
  'jsdom': '^29.1.1'
  'pinia': '^3.0.4'
  'typescript': '~6.0.3'
  'unocss': '^66.11.0'
  'unplugin-vue-components': '^32.1.0'
  'vite-plugin-lib-inject-css': '^2.2.2'
  'vite': 'npm:@voidzero-dev/vite-plus-core@1.4.0'
  'vite-plus': '1.4.0'
  'vue': '^3.5.44'
  'vue-router': '^5.4.0'
  'vue-tsc': '^3.3.13'
  'stylelint': '^17.16.0'
  'stylelint-config-recess-order': '^7.8.2'
  'stylelint-config-recommended': '^18.0.0'
  'stylelint-config-recommended-scss': '^17.0.1'
  'stylelint-config-recommended-vue': '^2.0.0'
  'postcss-html': '^1.8.0'
  'postcss-scss': '^4.0.9'
  '@playwright/test': '1.58.2'
overrides:
  vite@*: 'catalog:'
  vitest@*: '5.0.5'
  # 官方审计确认的受影响版本，仅提升到同主版本修复版。
  'ini@<1.3.6': '1.3.8'
  'dot-prop@>=5.0.0 <5.1.1': '5.3.0'
  'ansi-regex@>=4.0.0 <4.1.1': '4.1.1'
  'ansi-regex@>=5.0.0 <5.0.1': '5.0.1'
peerDependencyRules:
  allowedVersions:
    vite: '*'

# 当前依赖无待批准安装脚本；新增脚本必须显式审核。
strictDepBuilds: true
allowBuilds: {}
